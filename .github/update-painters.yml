import json
import time
import urllib.parse
import urllib.request
import ssl

OUTPUT_FILE = "painters.json"
SPARQL_URL = "https://query.wikidata.org/sparql"

PAINTER_TYPE = "wd:Q49757"
FRANCE = "wd:Q142"

USER_AGENT = "NVO987 Painters Bot/1.0"

ssl_context = ssl.create_default_context()


def safe(value):
    return (value or "").strip()


def fetch_json(query, retries=6):
    data = urllib.parse.urlencode({
        "query": query,
        "format": "json"
    }).encode("utf-8")

    req = urllib.request.Request(
        SPARQL_URL,
        data=data,
        headers={
            "User-Agent": USER_AGENT,
            "Accept": "application/sparql-results+json",
            "Content-Type": "application/x-www-form-urlencoded"
        },
        method="POST"
    )

    last_error = None

    for attempt in range(retries):
        try:
            with urllib.request.urlopen(
                req,
                timeout=120,
                context=ssl_context
            ) as response:

                raw = response.read().decode("utf-8")

                if not raw.strip():
                    raise ValueError("Empty response from Wikidata")

                return json.loads(raw)

        except Exception as error:
            last_error = error

            print(
                f"Wikidata request failed "
                f"(attempt {attempt + 1}/{retries}): {error}"
            )

            if attempt < retries - 1:
                time.sleep(5 * (attempt + 1))

    raise last_error


def run_batch(offset, limit=250):
    query = f"""
    SELECT DISTINCT
        ?person
        ?personLabel
        ?description
        ?website
        ?birthDate
        ?deathDate
        ?birthPlaceLabel
    WHERE {{
        ?person wdt:P106 {PAINTER_TYPE} ;
                wdt:P27 {FRANCE} .

        OPTIONAL {{
            ?person wdt:P856 ?website .
        }}

        OPTIONAL {{
            ?person wdt:P569 ?birthDate .
        }}

        OPTIONAL {{
            ?person wdt:P570 ?deathDate .
        }}

        OPTIONAL {{
            ?person wdt:P19 ?birthPlace .
        }}

        OPTIONAL {{
            ?person schema:description ?description .
            FILTER(LANG(?description) = "fr")
        }}

        SERVICE wikibase:label {{
            bd:serviceParam wikibase:language "fr,en" .
        }}
    }}
    ORDER BY ?person
    LIMIT {limit}
    OFFSET {offset}
    """

    return fetch_json(query)


def main():
    print("Fetching French painters from Wikidata...")

    painters = []
    seen_ids = set()

    offset = 0
    batch_size = 250

    while True:
        print(
            f"Fetching batch: "
            f"offset={offset}, limit={batch_size}"
        )

        result = run_batch(
            offset,
            batch_size
        )

        bindings = (
            result
            .get("results", {})
            .get("bindings", [])
        )

        if not bindings:
            break

        added_this_batch = 0

        for item in bindings:

            person_uri = safe(
                item
                .get("person", {})
                .get("value")
            )

            if not person_uri:
                continue

            person_id = person_uri.rsplit("/", 1)[-1]

            if person_id in seen_ids:
                continue

            seen_ids.add(person_id)

            name = safe(
                item
                .get("personLabel", {})
                .get("value")
            )

            if not name:
                continue

            description = safe(
                item
                .get("description", {})
                .get("value")
            )

            website = safe(
                item
                .get("website", {})
                .get("value")
            )

            birth_date = safe(
                item
                .get("birthDate", {})
                .get("value")
            )

            death_date = safe(
                item
                .get("deathDate", {})
                .get("value")
            )

            birth_place = safe(
                item
                .get("birthPlaceLabel", {})
                .get("value")
            )

            painter = {
                "id": person_id,
                "name": name,
                "type": "French painter",
                "birth": birth_date[:10]
                if birth_date else "",
                "death": death_date[:10]
                if death_date else "",
                "birthPlace": birth_place,
                "website": website,
                "website_valid": bool(website),
                "description": description,
                "source": (
                    f"https://www.wikidata.org/wiki/"
                    f"{person_id}"
                )
            }

            painters.append(painter)
            added_this_batch += 1

        print(
            f"Batch complete: "
            f"{len(bindings)} rows, "
            f"{added_this_batch} new painters"
        )

        if len(bindings) < batch_size:
            break

        offset += batch_size

        time.sleep(2)

    painters.sort(
        key=lambda painter:
        painter["name"].lower()
    )

    output = {
        "source": "Wikidata (CC0)",
        "license": "CC0 1.0",
        "country": "France",
        "type": "French painters",
        "count": len(painters),
        "painters": painters
    }

    with open(
        OUTPUT_FILE,
        "w",
        encoding="utf-8"
    ) as file:

        json.dump(
            output,
            file,
            ensure_ascii=False,
            indent=2
        )

    print(
        f"Done: {len(painters)} painters "
        f"written to {OUTPUT_FILE}"
    )


if __name__ == "__main__":
    main()
